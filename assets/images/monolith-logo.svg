<svg xmlns="http://www.w3.org/2000/svg" viewBox="192 42 116 237" width="100%" height="100%">
  <defs>
    <linearGradient id="coreEnergy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff416c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff4b2b;stop-opacity:1" />
    </linearGradient>
  </defs>
  <g transform="translate(50, -5)">
    <!-- Bloco direito (sombra) -->
    <polygon points="200,50 145,120 155,260 200,280" fill="#2c2c35" stroke="#93a2ba" stroke-width="2" />
    <!-- Bloco esquerdo (luz) -->
    <polygon points="200,50 255,120 245,260 200,280" fill="#3a3a48" stroke="#93a2ba" stroke-width="2" />
    <!-- Núcleo de energia -->
    <polygon points="200,90 212,160 200,220 188,160" fill="url(#coreEnergy)" />
    <polygon points="200,110 206,160 200,190 194,160" fill="#ffffff" opacity="0.8" />
    <line x1="200" y1="130" x2="235" y2="110" stroke="#ff4b2b" stroke-width="2" stroke-linecap="round" />
    <line x1="200" y1="130" x2="165" y2="110" stroke="#ff4b2b" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
